# Cloudflare Pages Configuration (OpenNext adapter)
#
# In Cloudflare Pages dashboard, set:
#   Build command: npx opennextjs-cloudflare build
#   Build output directory: .open-next
#   Deploy command: (leave empty — Cloudflare handles deploy automatically)
#
# Environment variables (set in Cloudflare dashboard):
#   DATABASE_URL - Neon PostgreSQL connection string
#   AUTH_SECRET - NextAuth secret (generate with: openssl rand -base64 32)
#   AUTH_URL - https://stiamond.net
#   NEXTAUTH_URL - https://stiamond.net
#   NEXT_PUBLIC_POSTHOG_KEY - PostHog project key
#   SENTRY_DSN - Sentry DSN (optional)

name = "stiamond"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next"
